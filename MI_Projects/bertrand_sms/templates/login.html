<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — Bertrand's Crawfish</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/static/css/main.css"/>
<style>
  body { display:flex; justify-content:center; align-items:center; min-height:100vh; background:#0f0f0f; }
  .login-box { background:#1a1a1a; border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:48px 40px; width:100%; max-width:400px; }
  .login-logo { text-align:center; margin-bottom:32px; }
  .login-logo .icon { font-size:48px; }
  .login-logo h1 { font-family:'Bebas Neue',sans-serif; font-size:28px; color:#E85D26; margin:8px 0 4px; }
  .login-logo p { color:#888; font-size:13px; }
  .error-msg { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#ef4444; padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:13px; }
  .form-group { margin-bottom:16px; }
  .form-group label { display:block; font-size:13px; color:#aaa; margin-bottom:6px; }
  .form-group input { width:100%; padding:12px 14px; background:#111; border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#fff; font-size:14px; box-sizing:border-box; }
  .form-group input:focus { outline:none; border-color:#E85D26; }
  .btn-login { width:100%; padding:13px; background:#E85D26; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; margin-top:8px; }
  .btn-login:hover { background:#d14d1a; }
  .hint { text-align:center; color:#555; font-size:12px; margin-top:16px; }
</style>
</head>
<body>
<div class="login-box">
  <div class="login-logo">
    <div class="icon">🦞</div>
    <h1>BERTRAND'S</h1>
    <p>Crawfish & Seafood Management</p>
  </div>
  {% if error %}
  <div class="error-msg">{{ error }}</div>
  {% endif %}
  <form method="POST" action="/login">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter username" required autofocus/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter password" required/>
    </div>
    <button type="submit" class="btn-login">Login →</button>
  </form>
  <div class="hint">Default: admin / admin123</div>
</div>
</body>
</html>
